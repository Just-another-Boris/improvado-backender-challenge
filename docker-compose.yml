services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [ "../docker/wait-for-it.sh", "db:5432", "--", "python", "manage.py", "runserver", "0.0.0.0:8000" ]
    env_file:
      path: ./src/core/.env
      required: false
    ports:
      - 8000:8000
    volumes:
      - app_static_files:/srv/app/static:rw
      - app_media_files:/srv/app/media:rw
      - .:/srv/app

  db:
    tty: true
    image: postgres:16-alpine
    volumes:
      - ./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - dev-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
    env_file:
      path: ./src/core/.env
      required: false
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 30s
      timeout: 15s
      retries: 5

  redis:
    image: redis:6-alpine
    networks:
      - default
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  clickhouse:
    image: "clickhouse/clickhouse-server:23.8.2.7-alpine"
    ports:
      - 8123:8123
    volumes:
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3

  celery_worker:
    container_name: celery_worker
    build:
      context: .
      dockerfile: ./Dockerfile
    command: celery -A core worker -l info 
    env_file:
      path: ./src/core/.env
      required: false
    depends_on:
      - app
      - redis
  
  celery_beat:
    container_name: celery_beat
    build:
      context: .
      dockerfile: ./Dockerfile
    command: celery -A core beat -l info 
    env_file:
      path: ./src/core/.env
      required: false
    depends_on:
      - app
      - redis
      - celery_worker

volumes:
  dev-db-data: {}
  app_media_files: { }
  app_static_files: { }
